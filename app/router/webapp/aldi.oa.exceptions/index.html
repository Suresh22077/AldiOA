<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exception Inbox</title>
  <script>
    // Clear stale cross-zone XSUAA sessions (mid-session expiry safety net)
    fetch('/odata/v4/oa/', { credentials: 'include', redirect: 'manual' })
      .then(function(r) {
        if (r.status === 403) {
          sessionStorage.setItem('postLoginUrl', window.location.pathname);
          window.location.href = '/do/logout';
        }
      })
      .catch(function() {});
  </script>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"aldi.oa.exceptions": "./"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="trusted"
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
  </script>
</head>
<body class="sapUiBody" id="content">
  <div data-sap-ui-component
       data-name="aldi.oa.exceptions"
       data-id="container"
       data-settings='{"id": "exceptions"}'>
  </div>
</body>
</html>
