<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligent OA Assignment Agent</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f7f7f8; margin: 0; padding: 40px; }
    .card { background: #fff; border: 1px solid #eaecee; border-radius: 8px; max-width: 640px; margin: 0 auto; padding: 32px; }
    h1 { color: #002a86; font-size: 22px; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; line-height: 1.6; }
    .links { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { background: #1b90ff; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: inline-block; }
    .btn.secondary { background: #fff; color: #002a86; border: 1px solid #eaecee; }
    #status { margin-top: 12px; font-size: 12px; color: #888; min-height: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Intelligent OA Assignment Agent</h1>
    <p>
      AI-powered Order Area (OA) assignment automation for Germany DE E11.<br>
      Automates the daily <strong>ZD2F_MASSMAINT_OAID</strong> run, detects exceptions,
      and generates actionable recommendations for OA Planners.
    </p>
    <div class="links">
      <button class="btn" onclick="openApp('/aldi.oa.exceptions/index.html')">Exception Inbox</button>
      <button class="btn" onclick="openApp('/aldi.oa.recommendations/index.html')">Recommendations</button>
      <a class="btn secondary" href="/odata/v4/oa/">OData Service</a>
    </div>
    <div id="status"></div>
  </div>

  <script>
    // After logout (logoutPage=/index.html), resume pending navigation
    var pending = sessionStorage.getItem('postLoginUrl');
    if (pending) {
      sessionStorage.removeItem('postLoginUrl');
      window.location.href = pending;
    }

    function openApp(url) {
      var status = document.getElementById('status');
      status.textContent = 'Checking session…';
      // Check OData with redirect:manual so a 302 to XSUAA login becomes status 0 (not 403)
      fetch('/odata/v4/oa/', { credentials: 'include', redirect: 'manual' })
        .then(function(r) {
          if (r.status === 403) {
            // Stale cross-zone session — clear it then resume
            status.textContent = 'Refreshing session, please wait…';
            sessionStorage.setItem('postLoginUrl', url);
            window.location.href = '/do/logout';
          } else {
            status.textContent = '';
            window.location.href = url;
          }
        })
        .catch(function() {
          status.textContent = '';
          window.location.href = url;
        });
    }
  </script>
</body>
</html>
